<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福岡家族旅行 2026 プランニング</title>
<style>
  :root{
    --paper: #FAF7F0;
    --paper-2: #F1ECE0;
    --paper-3: #ffffff;
    --ink: #21283B;
    --ink-soft: #5B6377;
    --line: #DDD5C4;
    --accent: #C97B2E;
    --accent-ink: #7A4A15;
    --indigo: #2F4468;
    --coral: #C1503E;
    --teal: #3E7C74;
    --shadow: 0 1px 2px rgba(33,40,59,0.07), 0 10px 26px -14px rgba(33,40,59,0.22);
    --radius: 14px;
    --font-display: "Hiragino Mincho ProN", "YuMincho", "Yu Mincho", "Noto Serif JP", serif;
    --font-body: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper: #161B29;
      --paper-2: #1E2436;
      --paper-3: #232A40;
      --ink: #ECE6D6;
      --ink-soft: #A9AFC2;
      --line: #323C56;
      --accent: #E3A75C;
      --accent-ink: #F0C085;
      --indigo: #8FA3D1;
      --coral: #E08776;
      --teal: #7CC0B4;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 14px 30px -16px rgba(0,0,0,0.65);
    }
  }
  :root[data-theme="dark"]{
    --paper: #161B29; --paper-2: #1E2436; --paper-3: #232A40; --ink: #ECE6D6; --ink-soft: #A9AFC2;
    --line: #323C56; --accent: #E3A75C; --accent-ink: #F0C085; --indigo: #8FA3D1; --coral: #E08776; --teal: #7CC0B4;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 14px 30px -16px rgba(0,0,0,0.65);
  }
  :root[data-theme="light"]{
    --paper: #FAF7F0; --paper-2: #F1ECE0; --paper-3: #ffffff; --ink: #21283B; --ink-soft: #5B6377;
    --line: #DDD5C4; --accent: #C97B2E; --accent-ink: #7A4A15; --indigo: #2F4468; --coral: #C1503E; --teal: #3E7C74;
    --shadow: 0 1px 2px rgba(33,40,59,0.07), 0 10px 26px -14px rgba(33,40,59,0.22);
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-variant-numeric: tabular-nums;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{ max-width: 880px; margin: 0 auto; padding: 28px 20px 80px; }

  a{ color: var(--indigo); }

  /* ---------- Hero / ticket ---------- */
  .ticket{
    position: relative;
    background: linear-gradient(155deg, var(--indigo) 0%, var(--ink) 100%);
    color: #F4EFE1;
    border-radius: var(--radius);
    padding: 30px 28px 26px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .ticket::after{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(circle at 88% -10%, rgba(227,167,92,0.35), transparent 45%);
    pointer-events:none;
  }
  .eyebrow{
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--accent-ink); font-weight: 600; margin: 0 0 6px;
  }
  .ticket h1{
    font-family: var(--font-display);
    font-size: clamp(26px, 4.2vw, 34px);
    margin: 0 0 18px;
    text-wrap: balance;
    font-weight: 600;
    letter-spacing: .01em;
  }
  .route{
    display:flex; align-items:center; gap: 14px; flex-wrap: wrap;
    font-family: var(--font-display);
    margin-bottom: 18px;
  }
  .route .city{ font-size: 22px; font-weight:600; }
  .route .code{ font-size: 12px; opacity:.75; letter-spacing:.08em; display:block; margin-top:2px; font-family: var(--font-body);}
  .route .plane{ flex:1; min-width:60px; height:1px; background: rgba(244,239,225,0.35); position:relative; }
  .route .plane::after{
    content:"✈"; position:absolute; right:0; top:50%; transform: translate(50%,-58%); font-size:14px; opacity:.85;
  }
  .ticket-dash{ border-top: 1.5px dashed rgba(244,239,225,0.3); margin: 18px 0; }
  .legs{ display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 14px 22px; font-size: 13.5px; }
  .legs .leg b{ display:block; font-size:14.5px; margin-bottom:2px; }
  .legs .leg span{ opacity:.8; }
  .pax-row{ margin-top: 18px; display:flex; flex-wrap:wrap; gap: 8px; }
  .pax-chip{
    font-size: 12.5px; padding: 5px 11px; border-radius: 999px;
    background: rgba(244,239,225,0.12); border: 1px solid rgba(244,239,225,0.28);
  }
  .pax-chip b{ font-weight:600; }

  /* ---------- sync status bar ---------- */
  .sync-bar{
    position: sticky; top: 0; z-index: 30;
    display:flex; align-items:center; gap:8px;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 10px 20px;
    font-size: 12.5px; color: var(--ink-soft);
  }
  .sync-bar .dot-status{
    width:8px; height:8px; border-radius:50%; flex:none;
    background: var(--ink-soft);
  }
  .sync-bar.connected .dot-status{ background: var(--teal); }
  .sync-bar.offline .dot-status{ background: var(--coral); }
  .sync-bar .sync-text{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lang-toggle{ display:flex; gap:4px; flex:none; }
  .lang-btn{
    font-family: var(--font-body); font-size: 11.5px; font-weight:600; cursor:pointer;
    border-radius: 999px; padding: 5px 10px; border: 1px solid var(--line);
    background: var(--paper-3); color: var(--ink-soft);
  }
  .lang-btn.active{ background: var(--indigo); color: #F4EFE1; border-color: var(--indigo); }

  select, textarea, input[type=text]{
    font-family: var(--font-body); font-size: 14.5px; color: var(--ink);
    background: var(--paper-3); border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 10px;
  }
  select:focus, textarea:focus, input:focus, button:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .btn{
    font-family: var(--font-body); font-size: 13.5px; font-weight:600; cursor:pointer;
    border-radius: 9px; padding: 9px 16px; border: 1px solid transparent;
    background: var(--accent); color: #241505; letter-spacing:.02em;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{ box-shadow: var(--shadow); transform: translateY(-1px); }
  .btn.ghost{ background: transparent; border-color: var(--line); color: var(--ink); }
  .btn.small{ padding: 5px 11px; font-size:12.5px; }
  .btn.danger{ background:transparent; color: var(--coral); border-color: var(--coral); }
  .hint{ font-size: 12px; color: var(--ink-soft); margin-top: 14px; }
  .toast{
    position: fixed; left:50%; bottom: 26px; transform: translate(-50%, 20px);
    background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px;
    font-size: 13.5px; opacity:0; pointer-events:none; transition: all .25s ease; box-shadow: var(--shadow);
    z-index: 40;
  }
  .toast.show{ opacity: 1; transform: translate(-50%, 0); }

  /* ---------- section headers ---------- */
  .section-head{ margin: 40px 0 16px; display:flex; align-items:baseline; gap:12px; }
  .section-head h2{
    font-family: var(--font-display); font-size: 21px; margin:0; font-weight:600;
  }
  .section-head .count{ font-size:12.5px; color: var(--ink-soft); }

  /* ---------- day card ---------- */
  .day{
    background: var(--paper-3); border: 1px solid var(--line); border-radius: var(--radius);
    margin-bottom: 18px; box-shadow: var(--shadow); overflow:hidden;
  }
  .day-head{
    display:flex; flex-direction:column; gap:8px; padding: 16px 20px;
    border-bottom: 1px solid var(--line); background: var(--paper-2);
  }
  .day-head-top{ display:flex; align-items:center; gap:14px; }
  .day-flight{
    font-size: 12.5px; font-weight:600; color: var(--indigo);
    display:flex; align-items:center; gap:6px;
  }
  .day-date{ flex:1; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .day-date b{ font-family: var(--font-display); font-size: 24px; font-weight:600; }
  .day-date span{ font-size:15px; font-weight:600; color: var(--indigo); letter-spacing:.02em; }
  .day-note{
    font-size: 11.5px; padding: 4px 10px; border-radius: 999px; white-space:nowrap;
    background: rgba(193,80,62,0.12); color: var(--coral); border:1px solid rgba(193,80,62,0.3);
  }
  .slots{ display:grid; grid-template-columns: 1fr; }
  .slot{ padding: 16px 20px; border-top: 1px solid var(--line); }
  .slot:first-child{ border-top:none; }
  .slot-head{ display:flex; align-items:center; gap:9px; margin-bottom: 10px; }
  .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .dot.morning{ background: var(--indigo); }
  .dot.lunch{ background: var(--teal); }
  .dot.dinner{ background: var(--accent); }
  .slot-head b{ font-family: var(--font-display); font-size:15px; font-weight:600; }
  .slot-head .time{ font-size:11.5px; color: var(--ink-soft); }
  .slot-head .weather{ margin-left:auto; font-size:12.5px; color: var(--ink-soft); white-space:nowrap; }

  .entries{ display:flex; flex-direction:column; gap:8px; margin-bottom: 10px; }
  .entry{
    display:flex; gap:10px; padding: 9px 12px; background: var(--paper-2);
    border-radius: 9px; border: 1px solid var(--line);
  }
  .entry .name{ font-size:12px; font-weight:700; color: var(--indigo); flex:none; width: 108px; }
  .entry .text{ font-size: 13.5px; white-space:pre-wrap; flex:1; }
  .entry.family{ border-color: var(--accent); background: rgba(201,123,46,0.08); }
  .entry.family .name{ color: var(--accent-ink); }
  .empty-note{ font-size: 12.5px; color: var(--ink-soft); font-style: italic; margin-bottom: 10px; }

  .add-form{ display:flex; flex-direction:column; gap:8px; }
  .add-form .who-row{ display:flex; align-items:center; gap:8px; }
  .add-form .who-row label{ font-size:12px; color: var(--ink-soft); flex:none; }
  .add-form .who-row select{ font-size:13px; padding:6px 8px; }
  .add-form .body-row{ display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  .add-form textarea{ flex:1; min-width: 200px; min-height: 40px; resize: vertical; }
  .add-form .btns{ display:flex; gap:6px; }

  /* ---------- recommendations ---------- */
  .tabs{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 16px; }
  .tab{
    font-family: var(--font-body); font-size:13px; font-weight:600; padding:7px 14px; border-radius:999px;
    border: 1px solid var(--line); background: var(--paper-3); color: var(--ink-soft); cursor:pointer;
  }
  .tab.active{ background: var(--indigo); color: #F4EFE1; border-color: var(--indigo); }
  .rec-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); gap:14px; }
  .rec-card{
    background: var(--paper-3); border:1px solid var(--line); border-radius: 12px; padding: 15px 16px;
    box-shadow: var(--shadow); display:flex; flex-direction:column; gap:8px;
  }
  .rec-card .area{ font-size:11px; color: var(--ink-soft); letter-spacing:.04em; }
  .rec-card h3{ font-family: var(--font-display); font-size:16px; margin:0; font-weight:600; }
  .rec-card p{ font-size:13px; color: var(--ink-soft); margin:0; flex:1; }
  .rec-card .rec-actions{ display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .rec-card .maplink{ font-size:12.5px; font-weight:600; text-decoration:none; }
  .add-to-day{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .add-to-day select{ font-size:12px; padding: 5px 6px; }

  footer{ margin-top: 46px; font-size:12.5px; color: var(--ink-soft); text-align:center; }

  @media (max-width: 520px){
    .entry{ flex-direction:column; }
    .entry .name{ width:auto; }
    .day-head{ padding: 14px 16px; }
    .slot{ padding: 14px 16px; }
  }
  @media (prefers-reduced-motion: reduce){
    .btn{ transition:none; }
    .toast{ transition:none; }
  }

  @media (max-width: 600px){
    .wrap{ padding: 20px 14px 60px; }
    .ticket{ padding: 22px 18px 20px; }
    .ticket h1{ margin-bottom: 14px; }
    .route{ gap: 10px; margin-bottom: 14px; }
    .route .city{ font-size: 19px; }
    .legs{ grid-template-columns: 1fr; gap: 10px; }
    .section-head{ margin: 30px 0 12px; }
    .section-head h2{ font-size: 19px; }
    .rec-grid{ grid-template-columns: 1fr; }
    .sync-bar{ padding: 8px 14px; }
    .add-form .body-row{ flex-direction: column; align-items: stretch; }
    .add-form textarea{ min-width: 0; }
    .add-form .btns{ justify-content: flex-end; }
    .add-to-day{ width: 100%; }
    .add-to-day .who-mini{ flex: 1 1 100%; }
    .add-to-day select:not(.who-mini){ flex: 1; min-width: 0; }
    .add-to-day button{ flex: none; }
  }
</style>
</head>
<body>

<div class="sync-bar" id="syncBar">
  <span class="dot-status" id="syncDot"></span>
  <span class="sync-text" id="syncText">接続中…</span>
  <div class="lang-toggle" id="langToggle">
    <button class="lang-btn" data-lang="ja" type="button">日本語</button>
    <button class="lang-btn" data-lang="ko" type="button">한국어</button>
  </div>
</div>

<div class="wrap">

  <section class="ticket">
    <p class="eyebrow" id="heroEyebrow"></p>
    <h1 id="heroTitle"></h1>
    <div class="route">
      <div><span class="city" id="fromCity"></span><span class="code">ICN</span></div>
      <div class="plane"></div>
      <div><span class="city" id="toCity"></span><span class="code">FUK</span></div>
    </div>
    <div class="ticket-dash"></div>
    <div class="legs" id="legs"></div>
    <div class="pax-row">
      <span class="pax-chip"><b>UENO / AI</b> ・8/6–8/12</span>
      <span class="pax-chip"><b>PARK / SUYON</b> ・8/6–8/12</span>
      <span class="pax-chip"><b>PARK / JONGHO</b> ・8/6–8/9</span>
      <span class="pax-chip"><b>PARK / SUBIN</b> ・8/6–8/9</span>
    </div>
  </section>

  <p class="hint" id="hintText"></p>

  <div class="section-head">
    <h2 id="scheduleHeading"></h2>
    <span class="count" id="scheduleRange"></span>
  </div>
  <div id="days"></div>

  <div class="section-head">
    <h2 id="recHeading"></h2>
    <span class="count" id="recSub"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="rec-grid" id="recGrid"></div>

  <footer id="footerText"></footer>
</div>

<div class="toast" id="toast"></div>

<script type="module">
(function(){
  "use strict";

  // Firebase connects lazily (see initFirebase below) via dynamic import,
  // so a blocked/slow network only disables live sync — it never stops
  // the itinerary and recommendations (which need no network) from
  // rendering.
  var fbSet = null;
  var fbRef = null;
  var db = null;

  var PARTICIPANTS = [
    { id:"ueno_ai", name:"UENO / AI" },
    { id:"park_jongho", name:"PARK / JONGHO" },
    { id:"park_subin", name:"PARK / SUBIN" },
    { id:"park_suyon", name:"PARK / SUYON" },
    { id:"family", name:null }
  ];

  var SLOTS = [
    { id:"morning", time:"8:00–11:00" },
    { id:"lunch", time:"11:00–17:00" },
    { id:"dinner", time:"17:00–21:00" }
  ];

  var DAYS = [
    { id:"d1", n:1, date:"8/6", iso:"2026-08-06", wd:{ja:"木",ko:"목"}, note:{ja:"到着日",ko:"도착일"},
      flight:{ code:"LJ265", dep:"ICN 15:35", arr:"FUK 17:00" } },
    { id:"d2", n:2, date:"8/7", iso:"2026-08-07", wd:{ja:"金",ko:"금"} },
    { id:"d3", n:3, date:"8/8", iso:"2026-08-08", wd:{ja:"土",ko:"토"} },
    { id:"d4", n:4, date:"8/9", iso:"2026-08-09", wd:{ja:"日",ko:"일"}, note:{ja:"JONGHO・SUBIN 帰国",ko:"JONGHO・SUBIN 귀국"},

    { id:"d5", n:5, date:"8/10", iso:"2026-08-10", wd:{ja:"月",ko:"월"}, note:{ja:"AI・SUYON のみ",ko:"AI・SUYON 만"} },
    { id:"d6", n:6, date:"8/11", iso:"2026-08-11", wd:{ja:"火",ko:"화"}, note:{ja:"AI・SUYON のみ",ko:"AI・SUYON 만"} },
    { id:"d7", n:7, date:"8/12", iso:"2026-08-12", wd:{ja:"水",ko:"수"}, note:{ja:"AI・SUYON 帰国",ko:"AI・SUYON 귀국"},
      flight:{ code:"LJ274", dep:"FUK 12:10", arr:"ICN 13:40", boarding:{ja:"AI・SUYON 搭乗",ko:"AI・SUYON 탑승"} } }
  ];

  var RECS = [
    { cat:"sightseeing", area:{ja:"百道浜",ko:"모모치하마"}, name:{ja:"福岡タワー",ko:"후쿠오카타워"},
      desc:{ja:"海浜公園そばに建つ234mのタワー。夜景が特に人気。",ko:"해변공원 옆에 서 있는 234m 타워. 특히 야경이 인기."} },
    { cat:"sightseeing", area:{ja:"中央区",ko:"주오구"}, name:{ja:"大濠公園",ko:"오호리공원"},
      desc:{ja:"池を囲む遊歩道が気持ちいい市民公園。ボートもあり。",ko:"연못을 둘러싼 산책로가 기분 좋은 시민공원. 보트도 탈 수 있음."} },
    { cat:"sightseeing", area:{ja:"太宰府市",ko:"다자이후시"}, name:{ja:"太宰府天満宮",ko:"다자이후 텐만구"},
      desc:{ja:"学問の神様を祀る古社。参道の梅ヶ枝餅も名物。",ko:"학문의 신을 모시는 유서 깊은 신사. 참배길 명물인 우메가에모치도 유명."} },
    { cat:"sightseeing", area:{ja:"中洲",ko:"나카스"}, name:{ja:"中洲屋台街",ko:"나카스 포장마차거리"},
      desc:{ja:"那珂川沿いに屋台が並ぶ、博多の夜の名物エリア。",ko:"나카강변을 따라 포장마차가 늘어선, 하카타의 밤을 대표하는 명물 거리."} },
    { cat:"sightseeing", area:{ja:"東区",ko:"히가시구"}, name:{ja:"マリンワールド海の中道",ko:"마린월드 우미노나카미치"},
      desc:{ja:"イルカ・アシカショーが人気の水族館。",ko:"돌고래・바다사자 쇼가 인기인 수족관."} },
    { cat:"sightseeing", area:{ja:"博多区",ko:"하카타구"}, name:{ja:"博多町家ふるさと館",ko:"하카타마치야 후루사토칸"},
      desc:{ja:"博多の伝統文化と町家建築を紹介するミニ資料館。",ko:"하카타의 전통문화와 마치야 건축을 소개하는 미니 자료관."} },
    { cat:"food", area:{ja:"天神",ko:"텐진"}, name:{ja:"一蘭 天神西通り店",ko:"이치란 텐진 니시도리점"},
      desc:{ja:"博多とんこつラーメンの有名店。一人集中カウンター。",ko:"하카타 돈코츠 라멘의 유명 맛집. 1인 집중 카운터석."} },
    { cat:"food", area:{ja:"博多区",ko:"하카타구"}, name:{ja:"博多もつ鍋 やまや",ko:"하카타 모츠나베 야마야"},
      desc:{ja:"福岡名物もつ鍋を気軽に楽しめる人気店。",ko:"후쿠오카 명물 모츠나베를 부담 없이 즐길 수 있는 인기 맛집."} },

  var STORAGE_KEY = "fukuoka-trip-2026-entries-cache";

  function loadLang(){

    return "ja";

  function buildWhoSelect(selectedId){

      sel.appendChild(opt);
    });
    return sel;
  }

  function slotKey(dayId, slotId){ return dayId + "_" + slotId; }

  // ---------- free-text translation ----------
  // Family members type their wishes in whichever language they like.
  // Detect Korean (Hangul) vs Japanese (kana/kanji) by Unicode range and,
  // when it doesn't match the page's current language, translate it via
  // the free MyMemory API. Results are cached so repeated re-renders
  // (every Firebase snapshot) don't refetch the same string.
  var HANGUL_RE = /[가-힣]/;
  var KANA_KANJI_RE = /[぀-ヿ一-鿿]/;
  var translationCache = {};

  function detectTextLang(text){
    if (HANGUL_RE.test(text)) return "ko";
    if (KANA_KANJI_RE.test(text)) return "ja";
    return null;
  }

  function translateForDisplay(text, targetLang, cb){
    var source = detectTextLang(text);
    if (!source || source === targetLang){ return; }
    var cacheKey = source + ">" + targetLang + ":" + text;
    if (translationCache.hasOwnProperty(cacheKey)){
      cb(translationCache[cacheKey]);
      return;
    }
    var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) +
      "&langpair=" + source + "|" + targetLang;
    fetch(url).then(function(res){ return res.json(); }).then(function(data){
      var translated = data && data.responseData && data.responseData.translatedText;
      if (translated && translated.toLowerCase() !== text.toLowerCase()){
        translationCache[cacheKey] = translated;
        cb(translated);
      }
    }).catch(function(){ /* keep showing the original text */ });
  }

  // ---------- weather ----------
  // Open-Meteo needs no API key and allows CORS from the browser, so this
  // is a single fetch at startup for the whole trip's hourly forecast.
  // Fukuoka: 33.5904N, 130.4017E.
  var WEATHER_ICONS = {
    0:"☀️", 1:"🌤️", 2:"⛅", 3:"☁️",
    45:"🌫️", 48:"🌫️",
    51:"🌦️", 53:"🌦️", 55:"🌦️",
    56:"🌧️", 57:"🌧️",
    61:"🌧️", 63:"🌧️", 65:"🌧️",
    66:"🌧️", 67:"🌧️",
    71:"🌨️", 73:"🌨️", 75:"🌨️", 77:"🌨️",
    80:"🌦️", 81:"🌧️", 82:"⛈️",
    85:"🌨️", 86:"🌨️",
    95:"⛈️", 96:"⛈️", 99:"⛈️"
  };
  var SLOT_HOURS = { morning: 9, lunch: 13, dinner: 19 };
  var weatherByHour = {};

  function fetchWeather(){
    // Open-Meteo renamed this hourly variable from "weathercode" to
    // "weather_code" to match their snake_case convention; request the
    // current name but accept either key when reading the response, in
    // case that changes again or an older/cached edge responds with the
    // legacy name.
    var url = "https://api.open-meteo.com/v1/forecast?latitude=33.5904&longitude=130.4017" +
      "&hourly=weather_code,temperature_2m&timezone=Asia%2FTokyo" +
      "&start_date=" + DAYS[0].iso + "&end_date=" + DAYS[DAYS.length - 1].iso;
    fetch(url).then(function(res){
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }).then(function(data){
      if (!data || !data.hourly || !data.hourly.time) return;
      var times = data.hourly.time;
      var codes = data.hourly.weather_code || data.hourly.weathercode;
      var temps = data.hourly.temperature_2m;
      if (!codes || !temps) return;
      for (var i = 0; i < times.length; i++){
        weatherByHour[times[i]] = { code: codes[i], temp: temps[i] };
      }
      renderDays();
    }).catch(function(){ /* weather is a nice-to-have; leave slots without it */ });
  }

  function weatherFor(day, slotId){
    var hour = SLOT_HOURS[slotId];
    var key = day.iso + "T" + (hour < 10 ? "0" + hour : hour) + ":00";
    return weatherByHour[key];
  }

  function loadCachedEntries(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e){}
    return {};
  }

  function cacheEntries(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch(e){}
  }

  // Writes a single day/slot/person cell straight to Firebase. Every
  // device listens via onValue, so this is what actually propagates the
  // change to everyone else in real time.
  function saveEntry(key, pid, text){
    if (!db){
      showToast(t().offlineSaveToast);
      return;
    }
    fbSet(fbRef(db, "entries/" + key + "/" + pid), text ? { text: text, ts: Date.now() } : null);

  // ---------- render: days ----------
  function flightLine(flight){
    var line = flight.code + "｜" + flight.dep + " " + t().depWord + " → " + flight.arr + " " + t().arrWord;
    if (flight.boarding) line += "（" + flight.boarding[currentLang] + "）";
    return line;

  function renderDays(){
    var host = document.getElementById("days");
    host.innerHTML = "";

    DAYS.forEach(function(day){
      var dayEl = document.createElement("div");
      dayEl.className = "day";

      var head = document.createElement("div");
      head.className = "day-head";
      head.innerHTML =
        '<div class="day-head-top">' +
          '<div class="day-date"><b>' + day.date + '（' + day.wd[currentLang] + '）</b>' +
          '<span>' + t().dayLabel + ' ' + day.n + '</span></div>' +
          (day.note ? '<div class="day-note">' + day.note[currentLang] + '</div>' : "") +
        '</div>' +
        (day.flight ? '<div class="day-flight">✈ ' + flightLine(day.flight) + '</div>' : "");
      dayEl.appendChild(head);

      var slotsWrap = document.createElement("div");
      slotsWrap.className = "slots";

      SLOTS.forEach(function(slot){
        slotsWrap.appendChild(renderSlot(day, slot));
      });

      dayEl.appendChild(slotsWrap);
      host.appendChild(dayEl);
    });

  function renderSlot(day, slot){
    var key = slotKey(day.id, slot.id);
    var data = entries[key] || {};

    var slotEl = document.createElement("div");
    slotEl.className = "slot";
    slotEl.dataset.day = day.id;
    slotEl.dataset.slot = slot.id;

    var weather = weatherFor(day, slot.id);
    var head = document.createElement("div");
    head.className = "slot-head";
    head.innerHTML =
      '<span class="dot ' + slot.id + '"></span>' +
      '<b>' + t().slotLabels[slot.id] + '</b>' +
      '<span class="time">' + slot.time + '</span>' +
      (weather ? '<span class="weather">' + (WEATHER_ICONS[weather.code] || "") + " " + Math.round(weather.temp) + '℃</span>' : "");
    slotEl.appendChild(head);

    var ids = Object.keys(data).filter(function(id){ return data[id] && data[id].text; });

    if (ids.length){
      var list = document.createElement("div");
      list.className = "entries";
      ids.forEach(function(pid){
        var row = document.createElement("div");
        row.className = "entry" + (pid === "family" ? " family" : "");
        var nameEl = document.createElement("div");
        nameEl.className = "name";
        nameEl.textContent = participantName(pid);
        var originalText = data[pid].text;
        var textEl = document.createElement("div");
        textEl.className = "text";
        textEl.textContent = originalText;
        row.appendChild(nameEl);
        row.appendChild(textEl);
        list.appendChild(row);

        translateForDisplay(originalText, currentLang, function(translated){
          textEl.textContent = translated;
          textEl.title = originalText;
        });
      });
      slotEl.appendChild(list);
    } else {
      var empty = document.createElement("div");
      empty.className = "empty-note";
      empty.textContent = t().emptyNote;
      slotEl.appendChild(empty);
    }

    var form = document.createElement("div");
    form.className = "add-form";

    var whoRow = document.createElement("div");
    whoRow.className = "who-row";
    var whoLabel = document.createElement("label");
    whoLabel.textContent = t().whoLabel;
    var whoSel = buildWhoSelect(getLastWho());
    whoRow.appendChild(whoLabel);
    whoRow.appendChild(whoSel);

    var bodyRow = document.createElement("div");
    bodyRow.className = "body-row";
    var ta = document.createElement("textarea");
    var btns = document.createElement("div");
    btns.className = "btns";
    var saveBtn = document.createElement("button");
    saveBtn.className = "btn small";
    saveBtn.textContent = t().saveBtn;
    var delBtn = document.createElement("button");
    delBtn.className = "btn small danger";
    delBtn.textContent = t().deleteBtn;

    function syncForm(){
      var pid = whoSel.value;
      var existing = data[pid] && data[pid].text;
      ta.value = existing || "";
      ta.placeholder = (pid === "family" ? t().placeholderFamily : participantName(pid) + t().placeholderPersonSuffix) + t().placeholderExample;
      delBtn.style.display = existing ? "" : "none";
    }
    whoSel.addEventListener("change", syncForm);
    syncForm();

    saveBtn.addEventListener("click", function(){
      var pid = whoSel.value;
      var val = ta.value.trim();
      setLastWho(pid);
      saveEntry(key, pid, val);
      showToast(t().saveToast);
    });

    delBtn.addEventListener("click", function(){
      var pid = whoSel.value;
      saveEntry(key, pid, "");
      showToast(t().deleteToast);
    });

    btns.appendChild(saveBtn);
    btns.appendChild(delBtn);
    bodyRow.appendChild(ta);
    bodyRow.appendChild(btns);
    form.appendChild(whoRow);
    form.appendChild(bodyRow);
    slotEl.appendChild(form);

    return slotEl;
  }

  // ---------- render: recommendations ----------
  function mapsUrl(name, area){
    var q = encodeURIComponent(name + " " + area + " 福岡");
    return "https://www.google.com/maps/search/?api=1&query=" + q;
  }

  function renderTabs(){
    var cats = [];

      p.textContent = r.desc[currentLang];
      card.appendChild(p);

      var actions = document.createElement("div");
      actions.className = "rec-actions";

      var a = document.createElement("a");
      a.className = "maplink";
      a.href = mapsUrl(r.name.ja, r.area.ja);
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = t().mapLink;
      actions.appendChild(a);

      var addWrap = document.createElement("div");
      addWrap.className = "add-to-day";

      SLOTS.forEach(function(s){
        var opt = document.createElement("option");

        opt.textContent = t().slotLabels[s.id];
        slotSel.appendChild(opt);
      });

      var whoSel = buildWhoSelect(getLastWho());

      var addBtn = document.createElement("button");
      addBtn.className = "btn small ghost";
      addBtn.textContent = t().addBtn;
      addBtn.addEventListener("click", function(){
        var pid = whoSel.value;
        var key = slotKey(daySel.value, slotSel.value);
        var existing = (entries[key] && entries[key][pid] && entries[key][pid].text) || "";
        var line = t().candidatePrefix + r.name[currentLang] + " — " + mapsUrl(r.name.ja, r.area.ja);
        var next = existing ? existing + "\n" + line : line;
        setLastWho(pid);
        saveEntry(key, pid, next);
        showToast(t().addToastTpl(r.name[currentLang], t().dayLabel + DAYS.find(function(d){return d.id===daySel.value;}).n, slotSel.options[slotSel.selectedIndex].text, participantName(pid)));
      });

      addWrap.appendChild(whoSel);
      addWrap.appendChild(daySel);
      addWrap.appendChild(slotSel);
      addWrap.appendChild(addBtn);
      actions.appendChild(addWrap);

      card.appendChild(actions);
      host.appendChild(card);
    });
  }

  // ---------- render: static (non-templated) text ----------
  function renderStatic(){
    document.documentElement.lang = currentLang;
    document.title = t().title;
    document.getElementById("heroEyebrow").textContent = t().heroEyebrow;
    document.getElementById("heroTitle").textContent = t().heroTitle;
    document.getElementById("fromCity").textContent = t().fromCity;
    document.getElementById("toCity").textContent = t().toCity;
    document.getElementById("hintText").textContent = t().hint;
    document.getElementById("scheduleHeading").textContent = t().scheduleHeading;
    document.getElementById("scheduleRange").textContent = t().scheduleRange;
    document.getElementById("recHeading").textContent = t().recHeading;
    document.getElementById("recSub").textContent = t().recSub;
    document.getElementById("footerText").textContent = t().footer;

    var legsHost = document.getElementById("legs");
    var legDays = [DAYS[0], DAYS[3], DAYS[6]];
    legsHost.innerHTML = "";
    legDays.forEach(function(day, i){
      var flight = day.flight;
      var span = day.date + "(" + day.wd[currentLang] + ") " + flight.dep + " " + t().depWord + " → " + flight.arr + " " + t().arrWord;
      var leg = document.createElement("div");
      leg.className = "leg";
      leg.innerHTML = "<b>" + t().legLabels[i] + "｜" + flight.code + "</b><span>" + span + "</span>";
      legsHost.appendChild(leg);
    });

    document.querySelectorAll(".lang-btn").forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.lang === currentLang);
    });
    setSyncStatus(lastSyncState);
  }

  function setLang(lang){
    if (lang === currentLang) return;
    currentLang = lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
    renderStatic();
    renderTabs();
    renderRecs();
    renderDays();
  }

  document.getElementById("langToggle").addEventListener("click", function(e){
    var btn = e.target.closest(".lang-btn");
    if (btn) setLang(btn.dataset.lang);
  });

  // ---------- init ----------
  // These need no network and must never be blocked by it.
  renderStatic();
  renderDays();
  renderTabs();
  renderRecs();

  // Weather is fetched once in the background; renderDays() re-runs when
  // it arrives (or never, if the request fails — slots just show no icon).
  fetchWeather();

  // Firebase config is safe to expose client-side (it's not a secret —
  // access is governed by the database's security rules, not by hiding
  // this object). Loaded via dynamic import so a blocked/slow network
  // degrades to offline mode instead of breaking the whole page.
  var firebaseConfig = {
    apiKey: "AIzaSyD48s5vodN5H3wCRw_HyekkXQRBWE_Ijjs",
    authDomain: "fukuokatripplan.firebaseapp.com",
    databaseURL: "https://fukuokatripplan-default-rtdb.firebaseio.com",
    projectId: "fukuokatripplan",
    storageBucket: "fukuokatripplan.firebasestorage.app",
    messagingSenderId: "503574437476",
    appId: "1:503574437476:web:0df95e1f59d1a22e89c971"
  };

  (async function initFirebase(){
    try {
      var appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      var dbMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");

      var fbApp = appMod.initializeApp(firebaseConfig);
      db = dbMod.getDatabase(fbApp);
      fbSet = dbMod.set;
      fbRef = dbMod.ref;

      // Firebase is the single source of truth: every device (including
      // the one that just wrote) receives the full "entries" tree here
      // and re-renders. This is what makes edits show up on everyone's
      // screen without passing links around.
      dbMod.onValue(fbRef(db, "entries"), function(snapshot){
        entries = snapshot.val() || {};
        cacheEntries();
        renderDays();
      });

      dbMod.onValue(fbRef(db, ".info/connected"), function(snapshot){
        setSyncStatus(snapshot.val() === true ? "connected" : "offline");
      });
    } catch(e){
      setSyncStatus("offline");
      showToast(t().offlineInitToast);
    }
  })();

})();
</script>
